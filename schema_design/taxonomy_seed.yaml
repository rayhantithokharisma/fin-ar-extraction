  counterparty:          {source: fk_counterparty}
  instrument:            {source: fk_instrument}
  facility:              {source: fk_facility}
  segment_business:      {source: issuer_extensible, std: [coal, nickel, copper_gold, gold, tin, bauxite_alumina, oil_gas, mining_services, plantation, cement, retail, consumer, property_development, recurring_property, toll_road, power, telco, banking_corporate, banking_retail, other, unallocated, elimination]}
