# ------------------------------------------------------------------ derived metrics (gold)
# DSL: concept ids; x[axis=member] filter; sum(x[axis=*]); avg(x) = mean(opening, closing); lag(x); days = period days; opt(x) = 0 if absent
metrics:
  - {id: gross_margin,     tpl: *NONFIN, formula: "fs.is.gross_profit / fs.is.revenue"}
  - {id: capex_cash,       tpl: *ALL,    formula: "fs.cf.acquisition_ppe + opt(fs.cf.additions_mine_properties_ee) + opt(fs.cf.acquisition_intangibles)", note: "Understates when additions are financed via payables or leases"}
  - {id: capex_rollforward, tpl: *ALL,   formula: "sum(note.ppe.gross_carrying[movement=additions]) + opt(sum(note.intangibles.gross_carrying[movement=additions]))"}
  - {id: d_and_a,          tpl: *ALL,    formula: "sum(note.ppe.accumulated_depreciation[movement=charge]) + opt(note.rou.depreciation) + opt(note.intangibles.amortization) + opt(note.mine_properties.amortization)", note: "Direct-method CF does not show D&A; build from rollforwards"}
  - {id: ebitda_computed,  tpl: *NONFIN, formula: "fs.is.profit_before_tax + fs.is.finance_costs - fs.is.finance_income - opt(fs.is.share_of_profit_associates) + d_and_a"}
  - {id: total_debt,       tpl: *NONFIN, formula: "opt(fs.bs.short_term_bank_loans) + opt(fs.bs.lt_borrowings_current) + opt(fs.bs.lt_borrowings_noncurrent) + opt(fs.bs.bonds_payable)"}
  - {id: net_debt,         tpl: *NONFIN, formula: "total_debt - fs.bs.cash_and_equivalents - opt(fs.bs.short_term_investments)"}
  - {id: net_debt_incl_leases, tpl: *NONFIN, formula: "net_debt + opt(fs.bs.lease_liabilities)"}
  - {id: fcf,              tpl: *NONFIN, formula: "fs.cf.net_cash_operating - capex_cash"}
  - {id: fcf_after_leases, tpl: *NONFIN, formula: "fcf - opt(fs.cf.lease_payments)"}
  - {id: der,              tpl: *NONFIN, formula: "total_debt / fs.bs.total_equity"}
  - {id: roe,              tpl: *ALL,    formula: "fs.is.profit_attributable[attribution=owners_of_parent] / avg(fs.bs.equity_attributable_owners)"}
  - {id: dso,              tpl: *NONFIN, formula: "avg(fs.bs.trade_receivables) / fs.is.revenue * days"}
  - {id: dio,              tpl: *NONFIN, formula: "avg(fs.bs.inventories) / fs.is.cost_of_revenue * days"}
  - {id: dpo,              tpl: *NONFIN, formula: "avg(fs.bs.trade_payables) / fs.is.cost_of_revenue * days"}
  - {id: cash_conversion_cycle, tpl: *NONFIN, formula: "dso + dio - dpo"}
  - {id: wc_change_derived, tpl: *NONFIN, formula: "-((fs.bs.trade_receivables - lag(fs.bs.trade_receivables)) + (fs.bs.inventories - lag(fs.bs.inventories)) - (fs.bs.trade_payables - lag(fs.bs.trade_payables)))", note: "Needed because direct-method CF has no working-capital lines"}
  - {id: payout_ratio,     tpl: *ALL,    formula: "fs.cf.dividends_paid[attribution=owners_of_parent] / lag(fs.is.profit_attributable[attribution=owners_of_parent])", note: "Final dividends paid in year t come from FY t-1 profit via RUPS"}
  - {id: nim_computed,     tpl: [BANK],  formula: "fs.is.bank.net_interest_income / avg(fs.bs.bank.placements + fs.bs.bank.marketable_securities + fs.bs.bank.government_bonds + fs.bs.bank.loans_gross)"}
  - {id: cost_of_credit,   tpl: [BANK],  formula: "fs.is.bank.impairment_expense / avg(fs.bs.bank.loans_gross)"}
  - {id: rnd_intensity,    tpl: *NONFIN, formula: "(opt(note.rnd.expense) + opt(sum(note.intangibles.gross_carrying[intangible_class=development_costs, movement=additions]))) / fs.is.revenue"}
  - {id: a_and_p_to_sales, tpl: *NONFIN, formula: "note.opex.breakdown[cost_component=advertising_promotion] / fs.is.revenue"}
  - {id: royalty_to_revenue, tpl: *NONFIN, formula: "sum(note.royalty.expense[counterparty=*]) / fs.is.revenue"}
  - {id: gross_to_net_leakage, tpl: *NONFIN, formula: "sum(note.revenue.gross_to_net[deduction_type=*]) / note.revenue.gross_sales"}
  - {id: implied_take_rate, tpl: [GENERAL], formula: "note.segment.revenue[segment_business=*] / op.tech.gtv[segment_business=*]", note: "Compare with company-stated op.tech.take_rate"}
  - {id: book_to_bill,     tpl: *NONFIN, formula: "op.core.new_contracts / fs.is.revenue"}
  - {id: backlog_cover_years, tpl: *NONFIN, formula: "op.core.order_backlog / fs.is.revenue"}
  - {id: sbc_to_revenue,   tpl: *NONFIN, formula: "note.share_based_payment.expense / fs.is.revenue"}
  - {id: public_sector_receivables_share, tpl: *NONFIN, formula: "sum(note.receivables.aging[customer_type=government] + note.receivables.aging[customer_type=soe] + note.receivables.aging[payer=bpjs_jkn]) / sum(note.receivables.aging[aging_bucket=*])"}
  - {id: revenue_implied_by_kpi, tpl: [GENERAL], formula: "op.coal.sales_volume * op.coal.asp", note: "Soft cross-check vs note.segment.revenue[segment_business=coal] after FX"}

# ------------------------------------------------------------------ validation rules
# tolerance rounding = n_terms x scale_as_reported
validation_rules:
  - {id: bs_identity,        severity: hard, tpl: *ALL,    expr: "fs.bs.total_assets == fs.bs.total_liabilities + opt(fs.bs.sharia.temporary_syirkah_funds) + fs.bs.total_equity", tol: rounding}
  - {id: bs_current_split,   severity: hard, tpl: *NONFIN, when: "bs_format == current_noncurrent", expr: "fs.bs.total_assets == fs.bs.total_current_assets + fs.bs.total_non_current_assets", tol: rounding}
  - {id: equity_attribution, severity: hard, tpl: *ALL,    expr: "fs.bs.total_equity == fs.bs.equity_attributable_owners + opt(fs.bs.non_controlling_interests)", tol: rounding}
  - {id: gross_profit,       severity: hard, tpl: *NONFIN, expr: "fs.is.gross_profit == fs.is.revenue - fs.is.cost_of_revenue", tol: rounding}
  - {id: net_profit,         severity: hard, tpl: *ALL,    expr: "fs.is.profit_for_the_period == fs.is.profit_before_tax - fs.is.income_tax_expense", tol: rounding}
  - {id: profit_attribution, severity: hard, tpl: *ALL,    expr: "fs.is.profit_for_the_period == sum(fs.is.profit_attributable[attribution=*])", tol: rounding}
  - {id: tci,                severity: hard, tpl: *ALL,    expr: "fs.oci.total_comprehensive_income == fs.is.profit_for_the_period + fs.oci.oci_total", tol: rounding}
  - {id: cf_sections,        severity: hard, tpl: *ALL,    expr: "fs.cf.net_change_cash == fs.cf.net_cash_operating + fs.cf.net_cash_investing + fs.cf.net_cash_financing", tol: rounding}
  - {id: cf_rollforward,     severity: hard, tpl: *ALL,    expr: "fs.cf.cash_ending == fs.cf.cash_beginning + fs.cf.net_change_cash + opt(fs.cf.fx_effect_cash)", tol: rounding}
  - {id: cf_ties_bs_cash,    severity: soft, tpl: *ALL,    expr: "fs.cf.cash_ending == fs.bs.cash_and_equivalents", tol: rounding, note: "Fails legitimately when overdrafts are netted in CF cash"}
  - {id: ppe_rollforward,    severity: hard, tpl: *ALL,    expr: "for each asset_class: closing == opening + sum(movements)", tol: rounding}
  - {id: ppe_ties_bs,        severity: hard, tpl: *ALL,    expr: "sum(note.ppe.gross_carrying[movement=closing]) - sum(note.ppe.accumulated_depreciation[movement=closing]) == fs.bs.ppe_net", tol: rounding}
  - {id: segment_sum,        severity: hard, tpl: *ALL,    expr: "sum(note.segment.revenue[segment_business=*]) == fs.is.revenue", tol: rounding, note: "elimination member included in sum"}
  - {id: eps_check,          severity: soft, tpl: *ALL,    expr: "fs.is.eps_basic ~= fs.is.profit_attributable[attribution=owners_of_parent] / note.eps.weighted_average_shares", tol: "pct:0.02"}
  - {id: comparative_consistency, severity: soft, tpl: *ALL, expr: "same (concept, period, dim_key) across filings equal unless is_restated_column", tol: rounding}
  - {id: grounding,          severity: hard, tpl: *ALL,    expr: "raw_text found verbatim on lineage.page"}
  - {id: unit_dimension,     severity: hard, tpl: *ALL,    expr: "unit.dimension == concept.unit_dimension"}
  - {id: required_qualifiers, severity: soft, tpl: *ALL,   expr: "all concept.required_qualifiers present in dims"}
  - {id: utilization_bounds, severity: soft, tpl: *ALL,    expr: "0 <= op.*.utilization <= 120 (pct)"}
  - {id: gross_to_net,       severity: hard, tpl: *NONFIN, expr: "note.revenue.gross_sales - sum(note.revenue.gross_to_net[deduction_type=*]) == fs.is.revenue", tol: rounding}
  - {id: intangibles_rollforward, severity: hard, tpl: *ALL, expr: "for each intangible_class: closing == opening + sum(movements)", tol: rounding}
  - {id: store_rollforward,  severity: soft, tpl: [GENERAL], expr: "op.retail.store_count[t] == op.retail.store_count[t-1] + op.retail.store_openings - op.retail.store_closures", tol: "abs:0"}
  - {id: revpar_identity,    severity: soft, tpl: *NONFIN, expr: "op.hotel.revpar ~= op.hotel.adr * op.hotel.occupancy", tol: "pct:0.03"}
  - {id: load_factor_identity, severity: soft, tpl: *NONFIN, expr: "op.air.load_factor ~= op.air.rpk / op.air.ask", tol: "pct:0.01"}
  - {id: gtv_exceeds_revenue, severity: soft, tpl: [GENERAL], expr: "op.tech.gtv >= note.segment.revenue (same segment)"}
  - {id: core_utilization_bounds, severity: soft, tpl: *ALL, expr: "0 <= op.core.capacity_utilization <= 120 (pct)"}

  # v0.3 — quarterly / annual interplay
  - {id: interim_opening_cash, severity: hard, tpl: *ALL, when: "doc_type == fs_interim", expr: "fs.cf.cash_beginning[YTD t] == fs.bs.cash_and_equivalents[FY t-1 close]", tol: rounding, note: "Soft instead if CF cash nets overdrafts"}
  - {id: interim_year_end_column_ties_annual, severity: soft, tpl: *ALL, expr: "prior year-end BS column in Q1/H1/9M filing == same instant in FY t-1 filing unless is_restated", tol: rounding}
  - {id: ytd_comparative_ties_prior_interim, severity: soft, tpl: *ALL, expr: "9M t-1 comparative column in 9M t filing == 9M t-1 current column in 9M t-1 filing unless is_restated", tol: rounding}
  - {id: reported_quarters_sum_to_fy, severity: soft, tpl: *ALL, expr: "sum(reported_discrete Q1..Q4) ~= FY value for additive concepts", tol: "pct:0.005"}
  - {id: derived_vs_reported_quarter, severity: soft, tpl: *ALL, expr: "derived_from_ytd == reported_discrete when both exist (has_alternate_source)", tol: "pct:0.01"}
  - {id: annual_report_matches_lk, severity: soft, tpl: *ALL, expr: "management_narrative fact == audited fact for same concept/period/dim_key", tol: rounding, note: "AR MD&A tables often round or reclassify"}
  - {id: q4_derived_outlier, severity: info, tpl: *ALL, expr: "derived Q4 outside mean(Q1..Q3) +/- 3 sd for fs.is.* concepts", note: "Year-end impairments, audit adjustments, bonuses; flags, never blocks"}
