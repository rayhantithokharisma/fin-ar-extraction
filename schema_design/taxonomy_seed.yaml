  deposit_type:          {source: standard, members: [current_account, savings, time_deposit]}
  loan_segment:          {source: issuer_extensible, std: [corporate, commercial, sme, micro, consumer, mortgage, auto, credit_card, payroll]}
  sharia_contract:       {source: standard, members: [murabahah, mudharabah, musyarakah, ijarah, istishna, qardh, salam]}
  product:               {source: issuer_extensible}
  commodity:             {source: standard, members: [coal, nickel, copper, gold, silver, tin, bauxite, alumina, cobalt, oil, gas, cpo, pko, rubber, cement, electricity]}
  market:                {source: standard, members: [domestic, domestic_dmo, export]}
