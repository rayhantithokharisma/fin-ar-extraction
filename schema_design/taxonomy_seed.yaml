# ------------------------------------------------------------------ operational KPI packs
# q = required qualifiers (fact is flagged if missing)
kpi_packs:
  # Industry-agnostic operational core. Any producer, distributor or service business uses these first;
  # industry packs define a specialized concept ONLY when its qualifiers or definition differ, and link
  # to the core via `broader_links` so cross-industry queries still roll up.
  core:
    - {id: op.core.production_volume,  unit: from_product, p: d, axes: [product, commodity, facility, raw_material], q_optional: [basis]}
    - {id: op.core.sales_volume,       unit: from_product, p: d, axes: [product, commodity, market, channel, brand, segment_geography]}
    - {id: op.core.installed_capacity, unit: from_product, p: i, axes: [product, facility], note: "Annualized nameplate"}
    - {id: op.core.capacity_utilization, unit: pct,        p: d, axes: [product, facility]}
    - {id: op.core.asp,                unit: from_product_price, p: d, axes: [product, market, channel]}
    - {id: op.core.unit_cash_cost,     unit: from_product_price, p: d, axes: [product], company_defined: true}
    - {id: op.core.volume_growth,      unit: pct,          p: d, axes: [product, segment_business]}
    - {id: op.core.price_growth,       unit: pct,          p: d, axes: [product, segment_business]}
    - {id: op.core.market_share,       unit: pct,          p: d, axes: [product, segment_geography], note: "Usually third-party sourced (Gaikindo, Nielsen); assurance=third_party"}
    - {id: op.core.facility_count,     unit: count,        p: i, axes: [facility_kind, segment_geography]}
    - {id: op.core.distribution_reach, unit: count,        p: i, axes: [channel], note: "Outlets / points of sale served"}
    - {id: op.core.customer_count,     unit: count,        p: i, axes: [customer_type, product]}
    - {id: op.core.export_share,       unit: pct,          p: d, axes: [product]}
    - {id: op.core.imported_input_share, unit: pct,        p: d, axes: [raw_material], note: "Share of raw materials imported (value or volume; state basis)"}
    - {id: op.core.raw_material_cost_share, unit: pct,     p: d, axes: [raw_material]}
    - {id: op.core.local_content_tkdn, unit: pct,          p: i, axes: [product], note: "TKDN score; gates government procurement preference"}
    - {id: op.core.new_contracts,      unit: IDR,          p: d, axes: [segment_business, customer_type]}
    - {id: op.core.order_backlog,      unit: IDR,          p: i, axes: [segment_business, customer_type]}
    - {id: op.core.fleet_count,        unit: units,        p: i, axes: [vehicle_type], q_optional: [basis]}
    - {id: op.core.recurring_revenue_share, unit: pct,     p: d, company_defined: true}
  coal:
    - {id: op.coal.production,          unit: Mt,          p: d, q: [basis], axes: [facility]}
    - {id: op.coal.sales_volume,        unit: Mt,          p: d, q: [basis], axes: [market, segment_geography]}
    - {id: op.coal.overburden_removal,  unit: Mbcm,        p: d, q: [basis]}
    - {id: op.coal.stripping_ratio,     unit: bcm_per_t,   p: d}
    - {id: op.coal.asp,                 unit: usd_per_t,   p: d, axes: [market]}
    - {id: op.coal.cash_cost_ex_royalty, unit: usd_per_t,  p: d, company_defined: true}
    - {id: op.coal.calorific_value,     unit: kcal_per_kg, p: d, q: [cv_basis]}
    - {id: op.coal.reserves,            unit: Mt,          p: i, q: [reserve_class, reporting_code, basis]}
    - {id: op.coal.resources,           unit: Mt,          p: i, q: [reserve_class, reporting_code, basis]}
  nickel:
    - {id: op.nickel.ore_production,    unit: wmt,         p: d, q: [basis, moisture_basis], axes: [facility]}
    - {id: op.nickel.ore_grade,         unit: pct,         p: d, axes: [facility]}
    - {id: op.nickel.ore_sales,         unit: wmt,         p: d, q: [moisture_basis], axes: [counterparty, market]}
    - {id: op.nickel.product_output,    unit: t,           p: d, q: [metal_basis, basis], axes: [product, facility], note: "NPI / ferronickel / matte / MHP; t Ni contained"}
    - {id: op.nickel.smelter_capacity,  unit: t,           p: i, axes: [facility, product]}
    - {id: op.nickel.utilization,       unit: pct,         p: d, axes: [facility]}
    - {id: op.nickel.asp,               unit: usd_per_t,   p: d, axes: [product]}
    - {id: op.nickel.cash_cost,         unit: usd_per_t,   p: d, axes: [product], company_defined: true}
    - {id: op.nickel.reserves,          unit: wmt,         p: i, q: [reserve_class, reporting_code, moisture_basis]}
  copper_gold:
    - {id: op.cugold.ore_milled,        unit: Mt,          p: d}
    - {id: op.cugold.head_grade_cu,     unit: pct,         p: d}
    - {id: op.cugold.head_grade_au,     unit: g_per_t,     p: d}
    - {id: op.cugold.recovery,          unit: pct,         p: d, axes: [commodity]}
    - {id: op.cugold.concentrate_production, unit: dmt,   p: d}
    - {id: op.cugold.metal_production,  unit: lb,          p: d, q: [metal_basis], axes: [commodity], note: "Cu in lb, Au in oz via unit override"}
    - {id: op.cugold.realized_price,    unit: usd_per_lb,  p: d, axes: [commodity]}
    - {id: op.cugold.c1_cash_cost,      unit: usd_per_lb,  p: d, company_defined: true}
    - {id: op.cugold.aisc,              unit: usd_per_lb,  p: d, company_defined: true}
    - {id: op.cugold.smelter_throughput, unit: dmt,        p: d, axes: [facility]}
  tin:
    - {id: op.tin.ore_production,       unit: t,           p: d, q: [metal_basis]}
    - {id: op.tin.refined_production,   unit: t,           p: d}
    - {id: op.tin.sales_volume,         unit: t,           p: d, axes: [market, segment_geography]}
    - {id: op.tin.asp,                  unit: usd_per_t,   p: d}
  oil_gas:
    - {id: op.og.lifting,               unit: boepd,       p: d, q: [basis], axes: [product]}
    - {id: op.og.realized_price_oil,    unit: usd_per_bbl, p: d}
    - {id: op.og.lifting_cost,          unit: usd_per_boe, p: d, company_defined: true}
    - {id: op.og.reserves,              unit: mmboe,       p: i, q: [reserve_class, reporting_code, basis]}
  plantation:
    - {id: op.plant.planted_area,       unit: ha,          p: i, axes: [crop_maturity, plantation_scheme]}
    - {id: op.plant.ffb_production,     unit: t,           p: d, axes: [plantation_scheme]}
    - {id: op.plant.ffb_yield,          unit: t_per_ha,    p: d}
    - {id: op.plant.cpo_production,     unit: t,           p: d}
    - {id: op.plant.oil_extraction_rate, unit: pct,        p: d}
    - {id: op.plant.cpo_asp,            unit: idr_per_kg,  p: d}
  cement:
    - {id: op.cement.sales_volume,      unit: Mt,          p: d, axes: [market, product]}
    - {id: op.cement.capacity,          unit: Mt,          p: i}
    - {id: op.cement.utilization,       unit: pct,         p: d}
  retail:
    - {id: op.retail.store_count,       unit: count,       p: i, axes: [store_format, brand, segment_geography], movement_ok: true}
    - {id: op.retail.net_store_additions, unit: count,     p: d}
    - {id: op.retail.selling_area,      unit: sqm,         p: i}
    - {id: op.retail.sssg,              unit: pct,         p: d, company_defined: true}
    - {id: op.retail.online_sales_share, unit: pct,        p: d}
    - {id: op.retail.store_openings,    unit: count,       p: d, axes: [store_format, brand]}
    - {id: op.retail.store_closures,    unit: count,       p: d, axes: [store_format, brand]}
    - {id: op.retail.sales_per_sqm,     unit: idr_per_sqm, p: d, company_defined: true}
    - {id: op.retail.transactions,      unit: count,       p: d}
    - {id: op.retail.basket_size,       unit: idr_per_transaction, p: d}
    - {id: op.retail.loyalty_members,   unit: count,       p: i}
    - {id: op.retail.brands_operated,   unit: count,       p: i, note: "Brand-principal licensing model"}
  telco_tower:
    - {id: op.telco.subscribers,        unit: count,       p: i, axes: [product]}
    - {id: op.telco.arpu,               unit: idr_per_month, p: d, axes: [product]}
