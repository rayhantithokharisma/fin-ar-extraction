# taxonomy_seed.yaml — v0.3 (v0.2: operational core, cross-industry packs; v0.3: quarterly/annual aggregation rules)
# Industry variance lives HERE, not in DDL. Loaded into idxfin_ref.* tables.
# Concept id convention: <domain>.<area>.<name>
#   fs.bs / fs.is / fs.oci / fs.cf / fs.soce  face statements (audited)
#   note.<topic>                               note-level detail (audited)
#   op.<industry>                              operational KPIs (narrative, unaudited)
#   reg.<industry>                             regulator-defined ratios as reported (OJK formulas)
#   nongaap.*                                  company-defined metrics, stored with definition_text
#   esg.* / hr.*                               sustainability & workforce
#   ext.<ticker>.<slug>                        issuer extensions for unmappable lines
# Short keys: p = period (i instant, d duration); bal = dr/cr; t = data_type; tpl = templates

version: 0.3.0

tpl_sets:
  ALL: &ALL [GENERAL, PROPERTY, INFRASTRUCTURE, BANK, FINANCING, SECURITIES, INSURANCE, INSURANCE_P117]
  NONFIN: &NONFIN [GENERAL, PROPERTY, INFRASTRUCTURE]
  FIN: &FIN [BANK, FINANCING, SECURITIES, INSURANCE, INSURANCE_P117]
  INS: &INS [INSURANCE, INSURANCE_P117]

templates:
  - {id: GENERAL,        bs_format: current_noncurrent, cf_method: direct, desc: "Manufacturing, consumer, trading, mining, plantation, telco, retail, healthcare, tech"}
  - {id: PROPERTY,       bs_format: detect_per_filing,  cf_method: direct, desc: "Property, real estate, construction; some present unclassified balance sheets"}
  - {id: INFRASTRUCTURE, bs_format: current_noncurrent, cf_method: direct, desc: "Utilities, toll roads, transport, telecom infra"}
  - {id: BANK,           bs_format: liquidity,          cf_method: direct, desc: "Conventional and sharia banks (is_sharia overlay)"}
  - {id: FINANCING,      bs_format: liquidity,          cf_method: direct, desc: "Multifinance / leasing"}
  - {id: SECURITIES,     bs_format: liquidity,          cf_method: direct, desc: "Brokers, investment managers"}
  - {id: INSURANCE,      bs_format: liquidity,          cf_method: direct, desc: "Insurers before PSAK 117"}
  - {id: INSURANCE_P117, bs_format: liquidity,          cf_method: direct, desc: "Insurers under PSAK 117 (FY2025+)"}
sharia_overlay:
  adds_concepts: [fs.bs.sharia.temporary_syirkah_funds]
  adds_axes: [sharia_contract]
  identity_change: "assets = liabilities + temporary_syirkah_funds + equity"

accounting_regimes:
  - {id: PRE_2020,        effective_to: 2019-12-31, series_break: false, desc: "PSAK 55/50/60 instruments, PSAK 23 revenue, PSAK 30 operating leases off balance sheet"}
  - {id: PSAK71_72_73,    effective_from: 2020-01-01, series_break: true, desc: "ECL, contract-based revenue, leases on BS (ROU + lease liabilities; EBITDA step-up)"}
  - {id: PSAK_RENUMBERED, effective_from: 2024-01-01, series_break: false, desc: "IFRS-aligned numbering (71->109, 72->115, 73->116, 5->108); reference mapping only"}
  - {id: PSAK117,         effective_from: 2025-01-01, series_break: true, templates: [INSURANCE_P117], desc: "Insurance contracts: insurance revenue, service result, CSM"}

