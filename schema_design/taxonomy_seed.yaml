# KPI packs attach to issuer SEGMENTS, not issuers (conglomerates run several packs at once).
# Stored in idxfin_ref.issuer_kpi_pack. Fictional example:
pack_assignment_example:
  - {ticker: XXXX, pack: automotive_equipment, segment_member: automotive,       valid_from: 2015-01-01}
