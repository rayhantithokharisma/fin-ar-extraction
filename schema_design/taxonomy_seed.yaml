  maturity_bucket:       {source: standard, members: [current, non_current, within_1y, 1_to_2y, 2_to_5y, over_5y]}
  aging_bucket:          {source: standard, members: [not_past_due, pd_1_30, pd_31_60, pd_61_90, pd_91_180, pd_over_180]}
  movement:              {source: standard, members: [opening, additions, business_combination, disposals, transfers, charge, impairment, reversal, write_off, fx_translation, remeasurement, closing]}
  asset_class:           {source: standard, members: [land, land_rights, buildings, infrastructure, machinery, heavy_equipment, vehicles, vessels, office_equipment, construction_in_progress, bearer_plants, mine_properties, other]}
  inventory_category:    {source: standard, members: [raw_materials, work_in_process, finished_goods, spare_parts, merchandise, fuel, ore_stockpile, excise_stamps, re_land, re_under_development, re_completed_units, other]}
