# How duration concepts aggregate across periods -> ref.concept.period_aggregation.
# Drives which facts may be subtracted (discrete quarters) or summed (TTM).
period_aggregation:
  default_by_data_type: {monetary: additive, quantity: additive, count: additive, shares: non_additive, per_share: non_additive, ratio: non_additive, text: non_additive}
  kpi_default: additive
  non_additive_units: [pct, pure, bp, g_per_t, kcal_per_kg, bcm_per_t, t_per_ha, boepd, vehicles_per_day, usd_per_t, usd_per_lb, usd_per_oz, usd_per_bbl, usd_per_boe, usd_per_day, idr_per_kg, idr_per_month, idr_per_unit, idr_per_transaction, idr_per_room_night, idr_per_sqm]
  overrides:
    note.eps.weighted_average_shares: non_additive

# Condensed interim notes: these are expected only in annual filings (ref.template_concept.expected_in).
annual_only_expectations: [note.ppe.gross_carrying, note.ppe.accumulated_depreciation, note.intangibles.gross_carrying, note.receivables.aging, note.employee_benefits.discount_rate, note.fin_risk.sensitivity_profit, note.fair_value.hierarchy, note.major_customer.revenue]

# ------------------------------------------------------------------ core financial concepts
concepts:
  # Balance sheet — general
  - {id: fs.bs.cash_and_equivalents,   en: Cash and cash equivalents,  id_label: Kas dan setara kas,              p: i, bal: dr, t: monetary, tpl: *ALL}
  - {id: fs.bs.short_term_investments, en: Short-term investments,     id_label: Investasi jangka pendek,         p: i, bal: dr, t: monetary, tpl: *NONFIN}
  - {id: fs.bs.trade_receivables,      en: Trade receivables,          id_label: Piutang usaha,                   p: i, bal: dr, t: monetary, tpl: *NONFIN, axes: [counterparty_relation, currency_denomination]}
  - {id: fs.bs.other_receivables,      en: Other receivables,          id_label: Piutang lain-lain,               p: i, bal: dr, t: monetary, tpl: *ALL, axes: [counterparty_relation]}
